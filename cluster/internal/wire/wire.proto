syntax = "proto3";

package skygo.cluster.v1;

option go_package = "github.com/scott4game/skygo/cluster/internal/wire;wire";

enum Kind {
  KIND_UNSPECIFIED = 0;
  KIND_HELLO = 1;
  KIND_HELLO_ACK = 2;
  KIND_RESOLVE_REQUEST = 3;
  KIND_RESOLVE_RESPONSE = 4;
  KIND_CALL = 5;
  KIND_SEND = 6;
  KIND_RESPONSE = 7;
  KIND_PING = 8;
  KIND_PONG = 9;
}

enum ErrorCode {
  ERROR_CODE_OK = 0;
  ERROR_CODE_REMOTE_UNAVAILABLE = 1;
  ERROR_CODE_STALE_REF = 2;
  ERROR_CODE_SERVICE_NOT_FOUND = 3;
  ERROR_CODE_SERVICE_NOT_READY = 4;
  ERROR_CODE_SERVICE_STOPPING = 5;
  ERROR_CODE_PROTOCOL_NOT_FOUND = 6;
  ERROR_CODE_PROTOCOL_TYPE_MISMATCH = 7;
  ERROR_CODE_CODEC = 8;
  ERROR_CODE_MAILBOX_TIMEOUT = 9;
  ERROR_CODE_MAILBOX_FULL = 10;
  ERROR_CODE_CALL_TIMEOUT = 11;
  ERROR_CODE_CALL_CYCLE = 12;
  ERROR_CODE_BACKPRESSURE = 13;
  ERROR_CODE_HANDLER = 14;
}

message Target {
  string node = 1;
  string incarnation = 2;
  string service = 3;
  uint64 address = 4;
  uint64 generation = 5;
}

message CallFrame {
  string node = 1;
  string service = 2;
  string protocol = 3;
}

message RemoteError {
  ErrorCode code = 1;
  string message = 2;
}

message Envelope {
  uint32 version = 1;
  Kind kind = 2;
  uint64 request_id = 3;
  string source_node = 4;
  string incarnation = 5;
  int64 timestamp_unix_milli = 6;
  bytes nonce = 7;
  bytes mac = 8;
  Target target = 9;
  string service = 10;
  string protocol = 11;
  string fingerprint = 12;
  int64 deadline_unix_nano = 13;
  repeated CallFrame call_path = 14;
  bytes payload = 15;
  RemoteError error = 16;
  string trace_id = 17;
}
